<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>ألعاب عائلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#120b2e;--bg2:#24104f;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.13);--txt:#fff;--mut:#bdb6dc;--acc:#ffc23d;--ok:#22e0a1;--bad:#ff5a76;--gc:#ffc23d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--txt);background:var(--bg1);
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(110% 70% at 85% -10%,#4a1d9a 0%,transparent 60%),
             radial-gradient(90% 60% at -10% 110%,#0b5a7a 0%,transparent 55%),
             linear-gradient(165deg,var(--bg1),var(--bg2))}
body{overscroll-behavior:none}
#app{max-width:520px;margin:0 auto;padding:10px 14px calc(30px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0 10px}
.logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px}
.logo b{background:linear-gradient(90deg,#ffc23d,#ff6b9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap;color:#fff}
.chip.btnchip{cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;backdrop-filter:blur(10px)}
.hero{text-align:center;padding:18px 0 6px}
.hero .big{font-size:44px;font-weight:900;line-height:1.1;background:linear-gradient(90deg,#ffc23d,#ff6b9a,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:8px 0 0;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:15px 14px;font-weight:800;font-size:18px;color:#1d1240;background:var(--acc);cursor:pointer;margin:9px 0;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.pink{background:#ff6b9a;color:#fff}.btn.teal{background:#22e0a1}.btn.blue{background:#5cc8ff}
.btn.sec{background:var(--card2);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:#fff;box-shadow:none}
.btn.small{padding:10px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}.row>*{flex:1}
label.lb{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
input.name{width:100%;font:inherit;font-size:18px;font-weight:700;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none;text-align:center}
input.name:focus{border-color:var(--acc)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.av{font-size:27px;aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.06);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.av.sel{border-color:var(--acc);background:rgba(255,194,61,.18)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{border-radius:18px;padding:13px 11px;background:rgba(255,255,255,.06);border:2px solid transparent;text-align:right;cursor:pointer;color:#fff;position:relative}
.game .gi{font-size:28px}.game .gn{font-weight:800;font-size:16px;margin:4px 0 2px}.game .gd{font-size:12.5px;color:var(--mut);line-height:1.45}
.game.sel{border-color:var(--g);background:color-mix(in srgb,var(--g) 18%,transparent)}
.game .mn{position:absolute;top:9px;left:10px;font-size:11px;color:var(--mut)}
.game.wide{grid-column:span 2}
.sect{font-weight:800;font-size:16px;margin:2px 0 10px;display:flex;align-items:center;gap:6px}
.mut{color:var(--mut)}.c{text-align:center}
.code{font-size:46px;font-weight:900;letter-spacing:8px;text-align:center;direction:ltr;margin:4px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pl{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px;min-height:62px;position:relative}
.pl .pa{font-size:30px}.pl .pn{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ps{font-size:12px;color:var(--mut)}
.pl.empty{border:1.5px dashed var(--line);background:transparent;justify-content:center;color:var(--mut);font-size:14px}
.pl.off{opacity:.45}
.tag{font-size:11px;border-radius:8px;padding:2px 7px;background:rgba(255,255,255,.12)}
.tag.ok{background:rgba(34,224,161,.2);color:#7dffd0}.tag.host{background:rgba(255,194,61,.2);color:#ffd77a}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.seg button.sel{background:var(--acc);color:#1d1240;border-color:var(--acc)}
.kp-disp{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0 14px}
.kp-disp span{width:50px;height:62px;border-radius:14px;background:rgba(0,0,0,.3);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.kp-disp span.f{border-color:var(--acc)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.kp button{padding:17px 0;font-size:26px;font-weight:800;border-radius:16px;border:0;background:var(--card2);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.kp button:active{transform:translateY(2px)}
.kp button.go{background:var(--ok);color:#06281c;font-size:19px}
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.gtitle{font-weight:900;font-size:17px;color:var(--gc);display:flex;gap:6px;align-items:center}
.timer{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 4px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gc),#ff6b9a);border-radius:99px;transition:width .2s linear}
.tsec{font-size:13px;color:var(--mut);text-align:left;direction:ltr}
.qcat{display:inline-block;background:color-mix(in srgb,var(--gc) 22%,transparent);color:var(--gc);font-weight:800;padding:5px 12px;border-radius:99px;font-size:14px}
.qtext{font-size:23px;font-weight:800;line-height:1.5;margin:12px 0 4px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.opt{min-height:82px;border-radius:18px;border:0;font-weight:800;font-size:18px;color:#fff;padding:12px 10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);line-height:1.35;transition:transform .1s,opacity .2s;position:relative}
.opt.o0{background:#e5484d}.opt.o1{background:#17a589}.opt.o2{background:#f39c3d}.opt.o3{background:#3f7fd6}
.opt.num{font-size:24px;direction:ltr}
.opt.sel{outline:4px solid #fff;outline-offset:2px;transform:scale(.97)}
.opt.dim{opacity:.32}
.opt.right{outline:4px solid var(--ok);outline-offset:2px}
.opt .who{position:absolute;bottom:5px;left:7px;font-size:16px;letter-spacing:-2px}
.opt[disabled]{cursor:default}
.wait{text-align:center;color:var(--mut);margin:14px 0 4px;font-size:15px}
.board{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.bp{flex:1;min-width:76px;background:rgba(255,255,255,.07);border-radius:14px;padding:7px 6px;text-align:center;position:relative;border:1.5px solid transparent}
.bp.me{border-color:rgba(255,255,255,.35)}
.bp .a{font-size:22px}.bp .n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bp .s{font-size:14px;font-weight:900;color:var(--acc)}
.bp .dn{position:absolute;top:-6px;left:-4px;background:var(--ok);color:#06281c;border-radius:99px;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:900}
.bp.off{opacity:.4}
.cd{font-size:120px;font-weight:900;text-align:center;line-height:1;margin:30px 0 10px;color:var(--gc);text-shadow:0 8px 30px rgba(0,0,0,.35);animation:pop .9s ease infinite}
@keyframes pop{0%{transform:scale(.7);opacity:.3}30%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.role{text-align:center;padding:22px 14px;border-radius:22px;margin:12px 0}
.role.in{background:linear-gradient(150deg,rgba(34,224,161,.25),rgba(34,224,161,.05));border:1.5px solid rgba(34,224,161,.5)}
.role.out{background:linear-gradient(150deg,rgba(255,90,118,.3),rgba(255,90,118,.05));border:1.5px solid rgba(255,90,118,.55)}
.role.hidden{background:rgba(255,255,255,.06);border:1.5px dashed var(--line)}
.role .w{font-size:38px;font-weight:900;margin:8px 0}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:18px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-weight:800;font-size:15px}
.vbtn .a{font-size:34px}
.vbtn.sel{border-color:var(--bad);background:rgba(255,90,118,.2)}
.res{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);margin:7px 0}
.res .a{font-size:26px}.res .n{flex:1;font-weight:700}.res .p{font-weight:900;font-size:17px;direction:ltr}
.res .p.plus{color:var(--ok)}.res .p.minus{color:var(--bad)}.res .p.zero{color:var(--mut)}
.res .x{font-size:13px;color:var(--mut)}
.banner{text-align:center;font-weight:900;font-size:22px;padding:14px;border-radius:18px;margin:10px 0}
.banner.ok{background:rgba(34,224,161,.18);color:#8bffd7}.banner.bad{background:rgba(255,90,118,.18);color:#ffb3c1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 8px}
.pod{flex:1;max-width:120px;text-align:center}
.pod .a{font-size:40px}.pod .n{font-weight:800;font-size:14px;margin:3px 0}
.pod .bar{border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,var(--acc),#ff8a3d);color:#1d1240;font-weight:900;font-size:18px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.pod.p2 .bar{background:linear-gradient(180deg,#d9d9ec,#9a9ab8)}.pod.p3 .bar{background:linear-gradient(180deg,#e9a16b,#a8643a)}
.reacts{display:flex;gap:6px;justify-content:center;margin-top:12px}
.reacts button{font-size:22px;background:rgba(255,255,255,.07);border:0;border-radius:12px;padding:7px 10px;cursor:pointer}
.float{position:fixed;bottom:80px;font-size:40px;pointer-events:none;animation:fl 2.2s ease-out forwards;z-index:50;text-align:center}
.float small{display:block;font-size:12px;color:#fff;background:rgba(0,0,0,.4);border-radius:8px;padding:1px 6px}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.1)}100%{transform:translateY(-260px) scale(1);opacity:0}}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-120px);background:#fff;color:#1d1240;font-weight:800;padding:12px 18px;border-radius:14px;z-index:99;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:15px}
#toast.show{transform:translate(-50%,0)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:40px auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#888}
.dot.d{background:var(--ok)}.dot.s{background:#5cc8ff}.dot.x{background:var(--bad)}
.betv{font-size:40px;font-weight:900;color:var(--gc);text-align:center}
.small{font-size:13px}
.room{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:18px;padding:12px;margin:9px 0;border:1.5px solid transparent}
.room.near{border-color:rgba(34,224,161,.35)}
.room .ra{font-size:34px}.room .ri{flex:1;min-width:0}.room .rn{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .rs{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.room .rb{width:auto;margin:0;padding:11px 16px;font-size:15px}
.pdots{letter-spacing:1px;font-size:11px}
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,4,24,.72);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:12px}
#modal.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:linear-gradient(170deg,#2a1563,#1a0f3d);border:1px solid var(--line);border-radius:26px;padding:20px 18px 14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:24px;font-weight:900;display:flex;gap:8px;align-items:center}
.sheet h3{font-size:16px;margin:16px 0 8px;color:var(--hc)}
.sheet ol,.sheet ul{margin:0;padding-inline-start:22px;line-height:1.75;font-size:15.5px}
.sheet li{margin:3px 0}
.sheet .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.helpbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:99px;padding:4px 10px;margin-top:8px;cursor:pointer}
.hint{font-size:13.5px;color:var(--mut);text-align:center;margin-top:8px;line-height:1.6}
/* ===== التصميم الجديد ===== */
:root{--bg1:#0a1020;--bg2:#111b36;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);--mut:#a9b4cf;--acc:#ff9f43;--ok:#2ee6a6;--bad:#ff5d73}
html,body{font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body::before{background:radial-gradient(80% 50% at 100% 0%,rgba(255,159,67,.22),transparent 60%),
  radial-gradient(70% 50% at 0% 100%,rgba(46,230,166,.15),transparent 60%),
  radial-gradient(60% 40% at 50% 45%,rgba(124,92,255,.13),transparent 70%),
  linear-gradient(180deg,var(--bg1),var(--bg2))}
.logo b{background:linear-gradient(90deg,#ff9f43,#ff5d73);-webkit-background-clip:text;background-clip:text}
.hero{padding:26px 0 10px}
.hero .big{font-size:50px;background:linear-gradient(90deg,#ff9f43,#ff5d73 50%,#8f74ff);-webkit-background-clip:text;background-clip:text}
.card{border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03));box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07)}
.btn{border-radius:16px;background:linear-gradient(180deg,#ffb066,#ff8a2b);color:#2a1300;box-shadow:0 5px 0 #b3561a,0 12px 24px rgba(255,138,43,.22)}
.btn:active{box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.pink{background:linear-gradient(180deg,#ff7a8e,#ff4d67);color:#fff;box-shadow:0 5px 0 #a8263b,0 12px 24px rgba(255,77,103,.2)}
.btn.teal{background:linear-gradient(180deg,#5af0bf,#1fcf93);color:#05281b;box-shadow:0 5px 0 #11845c,0 12px 24px rgba(31,207,147,.2)}
.btn.blue{background:linear-gradient(180deg,#7cc6ff,#3b9cf0);color:#fff;box-shadow:0 5px 0 #1f5f9c,0 12px 24px rgba(59,156,240,.2)}
.btn.violet{background:linear-gradient(180deg,#a58bff,#7c5cff);color:#fff;box-shadow:0 5px 0 #4a2fb3,0 12px 24px rgba(124,92,255,.22)}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.ghost{box-shadow:none}
.game{background:rgba(255,255,255,.045);border:1.5px solid var(--line);border-radius:20px}
.av{border-radius:16px;background:rgba(255,255,255,.05)}
.av.sel{border-color:var(--acc);background:rgba(255,159,67,.18)}
input.name{border-radius:16px;background:rgba(0,0,0,.3)}
.opt{border-radius:20px}
.opt.o0{background:linear-gradient(160deg,#ff6b6b,#e03e52)}.opt.o1{background:linear-gradient(160deg,#2fd3a8,#139c7c)}
.opt.o2{background:linear-gradient(160deg,#ffb347,#f0882a)}.opt.o3{background:linear-gradient(160deg,#5b9dff,#3a6fd8)}
.sheet{background:linear-gradient(170deg,#1a2747,#0d1630)}
.seg button.sel{background:var(--acc);border-color:var(--acc);color:#2a1300}
.tag.bad{background:rgba(255,93,115,.2);color:#ffb3c1}
.tag.priv{background:rgba(124,92,255,.25);color:#cfc2ff}
/* من يسأل مين */
.pairs{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pair{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.06);font-weight:800;font-size:15.5px}
.pair .num{width:26px;height:26px;border-radius:50%;background:var(--gc);color:#1d1240;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.pair .ar{color:var(--mut);font-size:13px;font-weight:700}
.pair.me{outline:2px solid var(--gc);background:color-mix(in srgb,var(--gc) 14%,transparent)}
/* شاشة الانتظار */
.wcard{text-align:center;padding:20px 14px;border-radius:24px;margin:14px 0;background:linear-gradient(160deg,rgba(46,230,166,.16),rgba(46,230,166,.03));border:1.5px solid rgba(46,230,166,.35)}
.wcard .big{font-size:46px}.wcard .t1{font-weight:900;font-size:20px;margin:4px 0}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wl div{display:flex;align-items:center;gap:6px;justify-content:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.06);font-size:14px;font-weight:700}
.wl div.ok{background:rgba(46,230,166,.18)}
.sum{display:flex;gap:8px;justify-content:center;margin:10px 0}
.res.good{background:rgba(46,230,166,.12)}.res.wrong{background:rgba(255,93,115,.1)}
/* ===== تصميم v2 ===== */
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-4%,3%) scale(1.08)}100%{transform:translate(0,0) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes shine{0%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
body::before{inset:-10%;animation:drift 18s ease-in-out infinite}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.2px);background-size:34px 34px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:10px 14px;background:rgba(10,16,32,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-size:19px}
.hero{padding:28px 0 12px}
.floaty{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
.floaty span{font-size:30px;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--g) 22%,rgba(255,255,255,.04));border:1px solid color-mix(in srgb,var(--g) 45%,transparent);
  box-shadow:0 8px 22px color-mix(in srgb,var(--g) 30%,transparent);animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}

function detectRegion(){
  let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'' }catch(e){}
  const gulf=['Asia/Riyadh','Asia/Kuwait','Asia/Qatar','Asia/Bahrain','Asia/Dubai','Asia/Muscat','Asia/Aden'];
  const arab=['Africa/Cairo','Asia/Amman','Asia/Beirut','Asia/Baghdad','Asia/Damascus','Asia/Gaza','Asia/Hebron','Africa/Casablanca','Africa/Tunis','Africa/Algiers','Africa/Tripoli','Africa/Khartoum','Africa/Nouakchott'];
  if(gulf.includes(tz)) return 'gulf';
  if(arab.includes(tz)) return 'arab';
  if(tz.startsWith('Europe/')) return 'eu';
  if(tz.startsWith('America/')) return 'am';
  if(tz.startsWith('Asia/')) return 'asia';
  if(tz.startsWith('Africa/')) return 'africa';
  return 'other';
}

/* ================= 4) عميل MQTT مصغّر (3.1.1 عبر WSS) ================= */
class MiniMQTT{
  constructor(url,{clientId,will,keepalive=30}={}){this.url=url;this.clientId=clientId;this.will=will;this.keepalive=keepalive;this.handlers=[];this.subs=new Set();this.pid=0;this.buf=new Uint8Array(0);this.connected=false;this.closedByUser=false;this.onclose=null}
  static enc(s){return new TextEncoder().encode(s)}
  static str(s){const b=MiniMQTT.enc(s);const o=new Uint8Array(b.length+2);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
  static cat(...a){let n=0;for(const x of a)n+=x.length;const o=new Uint8Array(n);let i=0;for(const x of a){o.set(x,i);i+=x.length}return o}
  static pkt(h,body){const len=[];let x=body.length;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;len.push(d)}while(x>0);return MiniMQTT.cat(new Uint8Array([h,...len]),body)}
  connect(timeout=6000){
    return new Promise((res,rej)=>{
      let done=false;this.buf=new Uint8Array(0);
      const fail=e=>{if(done)return;done=true;clearTimeout(to);try{ws&&ws.close()}catch(_){}rej(e)};
      const to=setTimeout(()=>fail(new Error('timeout')),timeout);
      let ws;
      try{ws=new WebSocket(this.url,['mqtt'])}catch(e){return fail(e)}
      this.ws=ws;ws.binaryType='arraybuffer';
      ws.onopen=()=>{
        let flags=0x02;const payload=[MiniMQTT.str(this.clientId)];
        if(this.will){flags|=0x04;if(this.will.retain)flags|=0x20;payload.push(MiniMQTT.str(this.will.topic));const m=MiniMQTT.enc(this.will.payload||'');payload.push(new Uint8Array([m.length>>8,m.length&255]),m)}
        ws.send(MiniMQTT.pkt(0x10,MiniMQTT.cat(MiniMQTT.str('MQTT'),new Uint8Array([4,flags,this.keepalive>>8,this.keepalive&255]),...payload)));
      };
      this._onConnack=rc=>{if(done)return;if(rc!==0)return fail(new Error('rc '+rc));done=true;clearTimeout(to);this.connected=true;this.closedByUser=false;
        clearInterval(this.pingI);this.pingI=setInterval(()=>this._send(new Uint8Array([0xC0,0])),this.keepalive*800);res(this)};
      ws.onmessage=e=>{if(this.ws===ws)this._data(new Uint8Array(e.data))};
      ws.onerror=()=>fail(new Error('ws error'));
      ws.onclose=()=>{if(this.ws!==ws)return;clearInterval(this.pingI);const was=this.connected;this.connected=false;if(!done){fail(new Error('closed'));return}
        if(was&&!this.closedByUser&&this.onclose)this.onclose()};
    });
  }
  _data(chunk){
    this.buf=MiniMQTT.cat(this.buf,chunk);
    while(this.buf.length>=2){
      let mul=1,len=0,i=1,b;
      do{if(i>=this.buf.length)return;b=this.buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);
      if(this.buf.length<i+len)return;
      const h=this.buf[0],body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);
      this._packet(h,body);
    }
  }
  _packet(h,b){
    const type=h>>4;
    if(type===2){this._onConnack&&this._onConnack(b[1]);return}
    if(type===3){
      const qos=(h>>1)&3,tl=(b[0]<<8)|b[1];const topic=new TextDecoder().decode(b.subarray(2,2+tl));let p=2+tl;
      if(qos>0){const i0=b[p],i1=b[p+1];p+=2;if(qos===1)this._send(new Uint8Array([0x40,2,i0,i1]))}
      const payload=new TextDecoder().decode(b.subarray(p));
      for(const fn of this.handlers.slice()){try{fn(topic,payload,!!(h&1))}catch(e){console.error(e)}}
    }
  }
  _send(u8){if(this.ws&&this.ws.readyState===1)this.ws.send(u8)}
  _id(){this.pid=(this.pid%65535)+1;return new Uint8Array([this.pid>>8,this.pid&255])}
  publish(topic,msg,retain=false){this._send(MiniMQTT.pkt(0x30|(retain?1:0),MiniMQTT.cat(MiniMQTT.str(topic),MiniMQTT.enc(msg))))}
  subscribe(topic){this.subs.add(topic);this._send(MiniMQTT.pkt(0x82,MiniMQTT.cat(this._id(),MiniMQTT.str(topic),new Uint8Array([0]))))}
  unsubscribe(topic){this.subs.delete(topic);this._send(MiniMQTT.pkt(0xA2,MiniMQTT.cat(this._id(),MiniMQTT.str(topic))))}
  on(fn){this.handlers.push(fn)}
  end(){this.closedByUser=true;clearInterval(this.pingI);this._send(new Uint8Array([0xE0,0]));const ws=this.ws;setTimeout(()=>{try{ws&&ws.close()}catch(_){}},80)}
}

const Net = {key:null,mq:null,idx:0,code:null,isHost:false,myId:null,hostId:null,peers:{},hp:null,leaving:false,reconnecting:false,helloT:null};

const newClient = (i,will)=>new MiniMQTT(BROKERS[i].url,{clientId:'fg_'+rid(12),will});

/* المضيف يختار أسرع خادم */
function connectFastest(will){
  return new Promise((res,rej)=>{
    let won=false,fails=0;
    BROKERS.forEach((b,i)=>{
      const mq=newClient(i,will);
      mq.connect().then(()=>{if(won){mq.end();return}won=true;res({mq,idx:i})})
        .catch(()=>{if(++fails===BROKERS.length&&!won)rej(new Error('no broker'))});
    });
  });
}
/* الاتصال بكل الخوادم (للبحث عن غرفة) */
function connectAll(indices,ms=5000){
  indices=indices||BROKERS.map((_,i)=>i);
  return new Promise(res=>{
    const out=[];let settled=0,fin=false;
    const finish=()=>{if(fin)return;fin=true;res(out)};
    setTimeout(finish,ms);
    indices.forEach(i=>{const mq=newClient(i);mq.connect(ms-300).then(()=>{if(fin){mq.end();return}out.push({mq,idx:i});if(++settled===indices.length)finish()}).catch(()=>{if(++settled===indices.length)finish()})});
  });
}
const isDirect = id=>{const p=Net.peers[id];return !!(p&&p.r&&p.r.readyState==='open')};

/* العميل → المضيف (المباشر أولاً تلقائياً) */
function sendHost(msg,forceMq){
  if(Net.isHost){const m=JSON.parse(JSON.stringify(msg));setTimeout(()=>hostHandle(Net.myId,m),0);return}
  msg.f=Net.myId;const s=JSON.stringify(msg);const hp=Net.hp;
  if(!forceMq&&hp&&hp.r&&hp.r.readyState==='open'){
    const ch=(msg.t==='pi'&&hp.u&&hp.u.readyState==='open')?hp.u:hp.r;
    try{ch.send(s);return}catch(e){}
  }
  if(Net.mq)Net.mq.publish(tp('/h'),s);
}
/* المضيف → لاعب واحد */
function sendTo(id,msg,forceMq){
  if(id===Net.myId){const m=JSON.parse(JSON.stringify(msg));setTimeout(()=>clientHandle(m),0);return}
  const s=JSON.stringify(msg);const p=Net.peers[id];
  if(!forceMq&&p&&p.r&&p.r.readyState==='open'){
    const ch=(msg.t==='po'&&p.u&&p.u.readyState==='open')?p.u:p.r;
    try{ch.send(s);return}catch(e){}
  }
  if(Net.mq)Net.mq.publish(tp('/c/'+id),s);
}
/* المضيف → الجميع */
function broadcast(msg){
  const others=H.players.filter(p=>p.id!==Net.myId&&p.on);
  if(others.length&&!others.some(p=>isDirect(p.id))) Net.mq&&Net.mq.publish(tp('/all'),JSON.stringify(msg));
  else others.forEach(p=>sendTo(p.id,msg));
  sendTo(Net.myId,msg);
}

async function reconnectLoop(){
  if(Net.reconnecting||!Net.mq||Net.leaving)return;
  Net.reconnecting=true;render();
  for(let i=0;i<8&&Net.mq&&!Net.leaving;i++){
    await sleep(800*(i+1));
    if(!Net.mq||Net.leaving)break;
    try{
      await Net.mq.connect();
      [...Net.mq.subs].forEach(s=>Net.mq.subscribe(s));
      Net.reconnecting=false;
      if(Net.isHost)publishRoom(true);else sendHost({t:'sync'},true);
      render();return;
    }catch(e){}
  }
  Net.reconnecting=false;
  if(Net.leaving)return;
  if(!Net.isHost)hostGone('انقطع الاتصال');else{toast('انقطع الاتصال بالخادم');render()}
}

/* ---------- WebRTC ---------- */
async function p2pStart(){
  if(Net.isHost||typeof RTCPeerConnection==='undefined')return;
  let pc;try{pc=new RTCPeerConnection(RTC_CFG)}catch(e){return}
  const hp=Net.hp={pc,q:[],r:null,u:null,t:null};
  hp.r=pc.createDataChannel('r',{ordered:true});
  hp.u=pc.createDataChannel('u',{ordered:false,maxRetransmits:0});
  const onmsg=ev=>{try{clientHandle(JSON.parse(ev.data))}catch(e){}};
  hp.r.onmessage=onmsg;hp.u.onmessage=onmsg;
  hp.r.onopen=()=>{clearTimeout(hp.t);C.direct=true;sendHost({t:'sync'});render()};
  hp.r.onclose=()=>{if(Net.hp===hp){Net.hp=null;if(C.direct){C.direct=false;if(C.joined){sendHost({t:'sync'},true);render()}}}};
  pc.onicecandidate=e=>{if(e.candidate)sendHost({t:'ice',d:e.candidate.toJSON()},true)};
  try{
    const off=await pc.createOffer();await pc.setLocalDescription(off);
    sendHost({t:'rtc',d:{type:'offer',sdp:pc.localDescription.sdp}},true);
  }catch(e){try{pc.close()}catch(_){}if(Net.hp===hp)Net.hp=null;return}
  hp.t=setTimeout(()=>{if(hp.r.readyState!=='open'){try{pc.close()}catch(e){}if(Net.hp===hp)Net.hp=null;C.direct=false;render()}},10000);
}
async function clientRtc(d){
  const hp=Net.hp;if(!hp||!d||d.type!=='answer')return;
  try{await hp.pc.setRemoteDescription(d);hp.q.forEach(c=>hp.pc.addIceCandidate(c).catch(()=>{}));hp.q=[]}catch(e){}
}
function clientIce(d){const hp=Net.hp;if(!hp||!d)return;if(hp.pc.remoteDescription)hp.pc.addIceCandidate(d).catch(()=>{});else hp.q.push(d)}
async function hostRtc(id,d){
  if(!d||d.type!=='offer')return;
  const old=Net.peers[id];if(old){try{old.pc.close()}catch(e){}}
  let pc;try{pc=new RTCPeerConnection(RTC_CFG)}catch(e){return}
  const p=Net.peers[id]={pc,r:null,u:null,q:[]};
  const setDirect=v=>{if(Net.peers[id]!==p)return;const pl=P(id);if(pl&&pl.direct!==v){pl.direct=v;pushLobby()}};
  pc.onicecandidate=e=>{if(e.candidate)sendTo(id,{t:'ice',d:e.candidate.toJSON()},true)};
  pc.ondatachannel=e=>{
    const ch=e.channel;
    ch.onmessage=ev=>{try{hostHandle(id,JSON.parse(ev.data))}catch(_){}};
    if(ch.label==='r'){p.r=ch;ch.onopen=()=>setDirect(true);ch.onclose=()=>{setDirect(false);if(Net.peers[id]===p)delete Net.peers[id]};if(ch.readyState==='open')setDirect(true)}
    else if(ch.label==='u')p.u=ch;
  };
  try{
    await pc.setRemoteDescription(d);p.q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));p.q=[];
    const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    sendTo(id,{t:'rtc',d:{type:'answer',sdp:pc.localDescription.sdp}},true);
  }catch(e){try{pc.close()}catch(_){}delete Net.peers[id];return}
  setTimeout(()=>{if(Net.peers[id]===p&&!(p.r&&p.r.readyState==='open')){try{pc.close()}catch(e){}delete Net.peers[id]}},10000);
}
function hostIce(id,d){const p=Net.peers[id];if(!p||!d)return;if(p.pc.remoteDescription)p.pc.addIceCandidate(d).catch(()=>{});else p.q.push(d)}

const H = {priv:false,pairs:[],state:'lobby',game:'categories',rounds:8,players:[],r:0,q:null,ph:null,ends:0,dur:0,timer:null,tok:0,closing:false,inputs:{},done:{},used:new Set(),turn:null,outId:null,lastOut:null,guessOpts:[],phStart:0,results:null,final:null,intervals:[],mm:'solo',teams:null,teamOf:{},pickTurn:0,alive:{},ffUsed:{},ffRm:{},ans:[],ansAuthors:[],tst:null};
const P = id=>H.players.find(p=>p.id===id);
const active = ()=>H.players.filter(p=>p.on);

async function createRoom(priv){
  const name=myName();C.screen='connecting';C.connMsg=priv?'جاري إنشاء غرفة خاصة…':'جاري إنشاء الغرفة…';render();
  H.priv=!!priv;Net.key=priv?rid(10):null;
  Net.isHost=true;Net.leaving=false;Net.myId=rid();Net.hostId=Net.myId;
  let ok=false;
  for(let attempt=0;attempt<3&&!ok;attempt++){
    Net.code=String(10000+rand(90000));
    try{
      const {mq,idx}=await connectFastest({topic:tp('/room'),payload:'',retain:true});
      // تأكد إن الرمز غير مستخدم
      const taken=await new Promise(r=>{const t=setTimeout(()=>r(false),700);mq.on((topic,p)=>{if(topic===tp('/room')&&p){clearTimeout(t);r(true)}});mq.subscribe(tp('/room'))});
      if(taken){mq.end();continue}
      mq.unsubscribe(tp('/room'));mq.handlers=[hostMq];
      Net.mq=mq;Net.idx=idx;mq.onclose=reconnectLoop;ok=true;
    }catch(e){break}
  }
  if(Net.leaving){if(Net.mq)Net.mq.end();Net.mq=null;Net.isHost=false;return}
  if(!ok){Net.isHost=false;toast('تعذّر الاتصال بالخوادم، جرّب مرة ثانية');goHome();return}
  Net.mq.subscribe(tp('/h'));
  Object.assign(H,{priv:!!priv,state:'lobby',game:H.game||'categories',players:[],r:0,ph:null,inputs:{},done:{},results:null});
  H.players.push({id:Net.myId,name,av:myAv(),score:0,on:true,ready:true,seen:Date.now(),direct:true});
  C.joined=true;C.me=Net.myId;C.state='lobby';C.screen=null;
  H.intervals.forEach(clearInterval);
  H.intervals=[setInterval(()=>publishRoom(true),20000),setInterval(hostWatch,2000)];
  setUrlRoom();publishRoom(true);pushLobby();
}
function hostMq(topic,payload){
  if(topic!==tp('/h'))return;
  let m;try{m=JSON.parse(payload)}catch(e){return}
  if(m&&m.f)hostHandle(m.f,m);
}
let pubT=null;
function publishRoom(now){
  if(!Net.isHost||!Net.mq)return;
  if(!now){if(pubT)return;pubT=setTimeout(()=>{pubT=null;publishRoom(true)},400);return}
  const me=P(Net.myId)||{};
  const info={code:Net.code,host:me.name,av:me.av,region:REGION,n:active().length,max:MAX_PLAYERS,state:H.state==='lobby'?'lobby':'game',game:H.game,ts:Date.now(),b:Net.idx,priv:!!H.priv};
  const s=JSON.stringify(info);
  Net.mq.publish(tp('/room'),s,true);
  Net.mq.publish(TOPIC_ROOT+'list/'+Net.code,H.priv?'':s,true); // الغرفة الخاصة ما تظهر في القائمة
  Net.mq.publish(tp('/s'),b64e(JSON.stringify({players:H.players.map(p=>({n:p.name,a:p.av})),game:H.game,state:H.state})));
}
function closeRoom(){
  if(!Net.mq)return;
  try{Net.mq.publish(tp('/room'),'',true);Net.mq.publish(TOPIC_ROOT+'list/'+Net.code,'',true)}catch(e){}
  H.intervals.forEach(clearInterval);H.intervals=[];clearTimeout(H.timer);
  Object.values(Net.peers).forEach(p=>{try{p.pc.close()}catch(e){}});Net.peers={};
}
function hostWatch(){
  const now=Date.now();let changed=false;
  H.players.forEach(p=>{if(p.id!==Net.myId&&p.on&&now-p.seen>12000){p.on=false;p.direct=false;changed=true;const pr=Net.peers[p.id];if(pr){try{pr.pc.close()}catch(e){}delete Net.peers[p.id]}}});
  if(H.state==='lobby'){const n=H.players.length;H.players=H.players.filter(p=>p.on);if(n!==H.players.length)changed=true}
  if(changed){pushLobby();if(H.state==='play')updateDone()}
}
function pubPlayers(){return H.players.map(p=>({id:p.id,name:p.name,av:p.av,on:p.on,ready:p.ready,direct:p.id===Net.myId||isDirect(p.id),host:p.id===Net.myId}))}

function stMsg(){return{t:'st',d:{s:H.state,ph:H.ph,ms:Math.max(0,H.ends-Date.now()),dur:H.dur,done:Object.keys(H.done),r:H.r,N:H.rounds,g:H.game,tb:!!H.tb}}}
function betOptions(p){const s=p?p.score:0;if(s<=0)return[100];const o=[100,250,500].filter(x=>x<s);o.push(s);return[...new Set(o)]}

function fullSync(id){
  sendTo(id,lobbyMsg());sendTo(id,scMsg());

}
function hostHandle(id,m){
  if(!m||!m.t)return;
  const p=P(id);
  if(p){p.seen=Date.now();if(!p.on&&m.t!=='bye'&&m.t!=='hello'){p.on=true;pushLobby();fullSync(id)}}
  const d=m.d||{};
  switch(m.t){
    case 'hello':return onHello(id,d);
    case 'pi':if(p)sendTo(id,{t:'po',d:{ts:d.ts}});return;
    case 'sync':if(p)fullSync(id);return;
    case 'bye':return onBye(id);
    case 'rtc':if(p)hostRtc(id,d);return;
    case 'ice':if(p)hostIce(id,d);return;
  }
  if(!p)return;
  switch(m.t){
    case 'pr':if(H.state==='lobby'&&id!==Net.myId){p.ready=!p.ready;pushLobby()}return;
    case 'in':return onInput(id,d);
    case 'vote':return onVote(id,d);
    case 'rp':broadcast({t:'fx',d:{k:'react',from:id,e:REACTS.includes(d.e)?d.e:'👏'}});return;
    case 'vc':return hostVoice(id,d);
  }
}
function onHello(id,d){
  const name=String(d.name||'لاعب').slice(0,16)||'لاعب',av=AVATARS.includes(d.av)?d.av:AVATARS[0];
  const welcome={t:'welcome',d:{id,hostId:Net.myId,code:Net.code}};
  let p=P(id);
  if(p){p.on=true;p.seen=Date.now();p.name=name;p.av=av;sendTo(id,welcome,true);pushLobby();fullSync(id);return}
  if(H.priv&&d.k!==Net.key)return sendTo(id,{t:'deny',d:{reason:'هذي غرفة خاصة 🔒 تدخلها بالرابط بس'}},true);
  if(H.state!=='lobby')return sendTo(id,{t:'deny',d:{reason:'اللعبة بدأت، انتظر لين يخلصون الجولة'}},true);
  if(active().length>=MAX_PLAYERS)return sendTo(id,{t:'deny',d:{reason:'الغرفة ممتلئة ('+MAX_PLAYERS+' لاعبين)'}},true);
  H.players.push({id,name,av,score:0,on:true,ready:false,seen:Date.now(),direct:false});
  sendTo(id,welcome,true);pushLobby();sendTo(id,scMsg());
}
function onBye(id){
  const p=P(id);if(!p)return;
  const pr=Net.peers[id];if(pr){try{pr.pc.close()}catch(e){}delete Net.peers[id]}
  if(H.state==='lobby')H.players=H.players.filter(x=>x.id!==id);else{p.on=false;p.direct=false}
  pushLobby();if(H.state==='play')updateDone();
}
function hostCtl(d){
  switch(d.v){
    case 'game':if(H.state==='lobby'&&GAMES[d.g]){H.game=d.g;pushLobby()}break;
    case 'rounds':if(H.state==='lobby'&&[5,8,12].includes(d.n)){H.rounds=d.n;pushLobby()}break;
    case 'mm':if(H.state==='lobby'&&(d.m==='solo'||d.m==='teams')){H.mm=d.m;pushLobby()}break;
    case 'draftgo':if(H.state==='play'&&H.game==='million'&&H.ph==='draft'&&draftLeft().length===0){H.teams.forEach((t,i)=>{if(!t.n)t.n=i?'الفريق الأزرق':'الفريق الأحمر'});nextRound()}break;
    case 'start':if(H.state==='lobby')startGame();break;
    case 'vote':if(H.state==='play'&&H.game==='outsider'&&(H.ph==='talk'||H.ph==='vote'))phaseEnd(H.tok);break;
    case 'next':if(H.state==='reveal'){H.tok++;nextRound()}break;

}
function startGame(){
  const g=GAMES[H.game],n=active().length;

  if(n>g.max){sendTo(Net.myId,{t:'fx',d:{k:'toast',m:'ترى «'+g.name+'» تدعم لين '+g.max+' لاعبين بس'}});return}

  if(bank&&(!bank.length||(H.game==='outsider'&&bank.length<4))){sendTo(Net.myId,{t:'fx',d:{k:'toast',m:'أضف أسئلة لهذي اللعبة أول'}});return}

  H.players.forEach(p=>{p.score=H.game==='auction'?AUCTION_START:0});
  H.r=0;H.used=new Set();H.lastOut=null;H.final=null;H.results=null;H.tb=false;H.tbN=0;H.tbIds=[];
  H.teams=null;H.teamOf={};H.alive={};H.ffUsed={};H.ffRm={};H.players.forEach(p=>{p.mt=0});

/* ----- المليونير: اختيار الفرق (قائدين عشوائي، كل قائد يكتب اسم فريقه ويختارون اللاعبين بالدور) ----- */
function startDraft(){
  const ids=shuffle(active().map(p=>p.id));
  H.teams=[{n:'',cap:ids[0]},{n:'',cap:ids[1]}];H.teamOf={};H.teamOf[ids[0]]=0;H.teamOf[ids[1]]=1;H.pickTurn=0;

}
function draftLeft(){return active().filter(p=>H.teamOf[p.id]==null).map(p=>p.id)}
function pushDraft(){active().forEach(p=>sendTo(p.id,roundMsg(p.id)))}
const ffKey=id=>H.mm==='teams'&&H.teamOf[id]!=null?'t'+H.teamOf[id]:id;
function millionOver(){

  return a.length<=1;

function setTimer(ms,fn){clearTimeout(H.timer);H.dur=ms;H.ends=Date.now()+ms;H.timer=setTimeout(fn,ms)}
function pickQ(g,flt){
  const bank=flt?BANK[g].filter(flt):BANK[g],key=q=>g==='outsider'?q.w:q.q;
  let used=LS.get('fg_used_'+g,[]);if(!Array.isArray(used))used=[];

  if(!pool.length){used=[];pool=bank.filter(q=>!H.used.has(key(q)));if(!pool.length)pool=bank.slice()}
  const q=pool[rand(pool.length)];used.push(key(q));H.used.add(key(q));LS.set('fg_used_'+g,used);

function nextRound(){

    if(NO_TB.includes(H.game)||H.tbN>=3)return endGame();
    const a=active();if(!a.length)return endGame();

  }
  const ids=active().map(p=>p.id);
  if(ids.length<GAMES[H.game].min){sendTo(Net.myId,{t:'fx',d:{k:'toast',m:'عدد اللاعبين ما يكفي، انتهت اللعبة'}});return endGame()}
  H.r++;H.inputs={};H.done={};H.results=null;H.ffRm={};H.ans=[];H.ansAuthors=[];H.tst=null;

    H.outId=ids[rr[0]%ids.length];H.lastOut=H.outId;

function startPlay(){H.state='play';enterPhase({outsider:'talk',categories:'answer',guess:'answer',auction:'bet',closest:'answer',whois:'answer',whosaid:'write',truth:'write',million:'answer'}[H.game])}
function phaseDur(){if(H.ph==='talk')return T.talk;if(H.ph==='vote')return T.vote;if(H.ph==='bet')return T.bet;
  if(H.ph==='write')return H.game==='truth'?T.truthWrite:T.write;if(H.ph==='guess')return T.whosaidGuess;
  if(H.game==='million')return H.mm==='teams'?T.millionTeam:T.million;return T[H.game]}
function enterPhase(ph){
  H.ph=ph;H.done={};H.closing=false;H.phStart=Date.now();

  if(H.game==='outsider'||ph==='draft'){clearTimeout(H.timer);H.dur=0;H.ends=0}else setTimer(phaseDur(),()=>phaseEnd(tok));

}
function phaseEnd(tok){

  if(H.game==='outsider'&&H.ph==='talk')return enterPhase('vote');
  if(H.game==='auction'&&H.ph==='bet'){active().forEach(p=>{const i=H.inputs[p.id]=H.inputs[p.id]||{};if(i.bet==null)i.bet=0});return enterPhase('answer')}

function onInput(id,d){

  if(g==='outsider'){
    if(ph!=='vote'||d.k!=='guess'||id!==H.outId||inp.guess!=null||!H.guessOpts.includes(d.v))return;
    inp.guess=d.v;
  }else if(g==='auction'&&ph==='bet'){
    if(d.k!=='bet'||inp.bet!=null||!betOptions(p).includes(d.v))return;
    inp.bet=d.v;
  }else if(g==='whois'){
    if(d.k!=='pick'||inp.pick!=null||!active().some(x=>x.id===d.v))return;

  }else if(g==='whosaid'){
    if(ph==='write'){if(d.k!=='txt'||inp.txt!=null)return;const t=String(d.v==null?'':d.v).trim().slice(0,80);if(!t)return;inp.txt=t}

    if(d.k!=='ans'||inp.ans!=null)return;
    const v=Number(d.v);if(!Number.isInteger(v)||v<0||v>3)return;

function onVote(id,d){
  if(H.state!=='play'||H.game!=='outsider'||H.ph!=='vote')return;

}
function isDone(id){
  const i=H.inputs[id]||{};
  if(H.game==='outsider')return H.ph==='vote'&&i.vote!=null&&(id!==H.outId||i.guess!=null);
  if(H.game==='auction'&&H.ph==='bet')return i.bet!=null;
  if(H.game==='whois')return i.pick!=null;
  if(H.game==='whosaid')return H.ph==='write'?i.txt!=null:i.gs!=null;
  if(H.game==='truth')return H.ph==='write'?(id!==H.turn||i.st!=null):(id===H.turn||i.ans!=null);

function updateDone(){

  if(H.ph!=='talk'&&H.ph!=='draft'&&!H.closing&&a.length&&a.every(p=>H.done[p.id])){

  }
}
function reveal(){

  const g=H.game,q=H.q,a=active(),res={g,items:[],r:H.r},delta={};
  H.players.forEach(p=>delta[p.id]=0);
  const I=id=>H.inputs[id]||{};
  if(g==='categories'){
    Object.assign(res,{q:q.q,o:q.o,c:q.c,correct:q.a});
    a.forEach(p=>{const i=I(p.id);let pts=0;if(i.ans===q.a)pts=500+Math.round(500*Math.max(0,1-i.t/T.categories));delta[p.id]=pts;res.items.push({id:p.id,ans:i.ans,pts,t:i.t})});
  }else if(g==='closest'){

    a.forEach(p=>{const i=I(p.id);let pts=0;if(i.ans!=null&&Math.abs(q.o[i.ans]-q.a)===best)pts=best===0?300:150;delta[p.id]=pts;res.items.push({id:p.id,ans:i.ans,pts,t:i.t})});

  }else if(g==='auction'){
    Object.assign(res,{q:q.q,o:q.o,c:q.c,correct:q.a});
    a.forEach(p=>{const i=I(p.id),bet=i.bet||0;let pts=0;if(bet)pts=i.ans===q.a?bet:-bet;delta[p.id]=pts;res.items.push({id:p.id,ans:i.ans,bet,pts,t:i.t})});
  }else if(g==='outsider'){
    const votes={};a.forEach(p=>{const v=I(p.id).vote;if(v)votes[v]=(votes[v]||0)+1});

function micOff(){
  const was=V.on||!!V.stream;V.on=false;
  try{V.proc&&(V.proc.onaudioprocess=null,V.proc.disconnect());V.src&&V.src.disconnect();V.mute&&V.mute.disconnect();(V.flt||[]).forEach(f=>f.disconnect())}catch(e){}
  if(V.stream)V.stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});
  V.stream=V.src=V.proc=V.mute=V.flt=null;
  audioMode('playback');
  if(was&&V.rebuilt&&C.joined)voiceRebuild(); // يرجع الصوت نظيف على المكبر بكامل قوته
  V.rebuilt=false;
  setTimeout(voiceReroute,300);
}
function voiceStop(){micOff();V.next={};V.seqs={};V.dl={}}
function micChunk(e){
  if(!V.on||!C.joined)return;
  const inp=e.inputBuffer.getChannelData(0),buf=new Float32Array(V.tail.length+inp.length);buf.set(V.tail);buf.set(inp,V.tail.length);
  const r=V.ctx.sampleRate/VR,out=[];let pos=V.pos,sq=0;
  while(pos+r<=buf.length){const a=Math.floor(pos),b=Math.max(a+1,Math.floor(pos+r));let s=0;for(let i=a;i<b;i++)s+=buf[i];s/=(b-a);out.push(s);sq+=s*s;pos+=r}
  const cut=Math.floor(pos);V.tail=buf.slice(cut);V.pos=pos-cut;
  if(!out.length)return;
  if(Math.sqrt(sq/out.length)>0.008)V.hang=10;else if(V.hang>0)V.hang--;else return; // ما نرسل وقت السكوت
  if(V.hang===0){const L=Math.min(out.length,96);for(let i=0;i<L;i++)out[out.length-1-i]*=i/L} // تخفيت آخر مقطع عشان ما تطلع طقّة
  const u8=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u8[i]=mulawEnc(out[i]);
  let bin='';for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);
  voiceOut({n:V.seq++,a:btoa(bin),r:VR});
}
function voiceOut(d){
  if(!C.joined)return;
  if(Net.isHost)return hostVoice(Net.myId,d);
  const s=JSON.stringify({t:'vc',d,f:Net.myId}),hp=Net.hp;
  if(hp&&hp.u&&hp.u.readyState==='open'){if(hp.u.bufferedAmount>65536)return;try{hp.u.send(s);return}catch(e){}}
  if(Net.mq)Net.mq.publish(tp('/h'),s);
}
function hostVoice(from,d){
  if(!Net.isHost||!d||typeof d.a!=='string'||d.a.length>6000||typeof d.n!=='number')return;
  const r=d.r===16000?16000:8000;
  const s=JSON.stringify({t:'vc',d:{f:from,n:d.n,a:d.a,r}});let viaMq=false;
  const tf=voiceTeam(from),hear=id=>tf==null||voiceTeam(id)===tf,mqIds=[]; // غرف الفرق: وقت سؤال المليونير كل فريق يسمع فريقه بس
  H.players.forEach(p=>{
    if(!p.on||p.id===from||p.id===Net.myId||!hear(p.id))return;
    const pr=Net.peers[p.id];
    if(pr&&pr.u&&pr.u.readyState==='open'&&pr.u.bufferedAmount<65536){try{pr.u.send(s);return}catch(e){}}
    viaMq=true;mqIds.push(p.id);
  });
  if(viaMq&&Net.mq){if(tf==null)Net.mq.publish(tp('/v'),s);else mqIds.forEach(id=>Net.mq.publish(tp('/c/'+id),s))} // صوت الفريق يروح لأعضائه بس، مو للموضوع العام
  if(from!==Net.myId&&hear(Net.myId))voicePlay({f:from,n:d.n,a:d.a,r});
}
/* رقم فريق اللاعب لو الصوت لازم ينفصل الحين (المليونير فريقين + وقت السؤال)، وإلا null = الكل يسمع الكل */
function voiceTeam(id){
  if(H.game!=='million'||H.mm!=='teams'||!H.teams||H.state!=='play'||H.ph!=='answer')return null;
  const t=H.teamOf[id];return t==null?null:t;
}
function voicePlay(d){
  if(!d||typeof d.a!=='string'||!d.f||d.f===C.me||d.f===Net.myId)return;
  const last=V.seqs[d.f];if(last!=null&&d.n<=last)return;V.seqs[d.f]=d.n; // بدون تكرار (لو وصل من الطريقين)
  const ctx=voiceCtx();if(!ctx)return;
  let bin;try{bin=atob(d.a)}catch(e){return}
  const n=bin.length;if(!n)return;
  const pcm=new Float32Array(n);for(let i=0;i<n;i++)pcm[i]=mulawDec(bin.charCodeAt(i));
  const sr=ctx.sampleRate,k=sr/(d.r===16000?16000:8000),len=Math.floor(n*k);
  const ab=ctx.createBuffer(1,len,sr),ch=ab.getChannelData(0);
  for(let j=0;j<len;j++){const x=j/k,i=Math.floor(x),f=x-i,a=pcm[i],b=i+1<n?pcm[i+1]:a;ch[j]=a+(b-a)*f}
  const now=ctx.currentTime,prev=V.next[d.f]||0;let dl=V.dl[d.f]||0.1,t=prev;
  if(t<now+0.01){
    if(prev&&now-prev<0.35)dl=Math.min(0.35,dl+0.05); // وصل متأخر وسط الكلام: نكبّر المخزن عشان ما يتقطع
    t=now+dl;const F=Math.min(len,96);for(let j=0;j<F;j++)ch[j]*=j/F; // بداية ناعمة بدون طقّة
  }else if(t>now+dl+0.25)return; // تأخر زايد: نتخطى هالمقطع عشان نلحق الكلام بدون ما يتداخل الصوت
  else dl=Math.max(0.08,dl-0.002); // الشبكة مستقرة: نقلل التأخير شوي شوي
  V.dl[d.f]=dl;
  const src=ctx.createBufferSource();src.buffer=ab;src.connect(V.out);
  src.start(t);V.next[d.f]=t+ab.duration;
}

(function(){
  const el=$('#micfab');let st=null;
  el.addEventListener('pointerdown',e=>{const r=el.getBoundingClientRect();st={x:e.clientX,y:e.clientY,ox:r.left,oy:r.top,drag:false,t:e.target.closest('[data-m]')};try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{
    if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.drag&&Math.hypot(dx,dy)<8)return;
    st.drag=true;el.classList.add('drag');el.style.right='auto';el.style.left=(st.ox+dx)+'px';el.style.top=(st.oy+dy)+'px';
  });
  el.addEventListener('pointerup',()=>{
    if(!st)return;const s=st;st=null;el.classList.remove('drag');
    if(s.drag){const r=el.getBoundingClientRect();MF.side=(r.left+r.width/2)<innerWidth/2?'left':'right';MF.y=r.top;LS.set('fg_micpos',{side:MF.side,y:MF.y});placeFab(el);return}
    const m=s.t&&s.t.dataset.m;if(!m)return;sfx('tap');voiceCtx();
    if(m==='mic')micToggle();
    else if(m==='hide'){MF.hide=true;LS.set('fg_michide',true);micFab()}
    else if(m==='show'){MF.hide=false;LS.set('fg_michide',false);micFab()}
  });
  el.addEventListener('pointercancel',()=>{st=null;el.classList.remove('drag');placeFab(el)});
  addEventListener('resize',()=>{if(C.joined)placeFab(el)});
})();

let RoomsConns=null,roomsRT=null,roomsTick=null;
async function openRooms(){
  closeRoomsConns();
  C.screen='rooms';C.rooms={};C.roomsLoading=true;render();
  const conns=await connectAll();
  if(C.screen!=='rooms'){conns.forEach(c=>c.mq.end());return}
  RoomsConns=conns;
  if(!conns.length){C.roomsLoading=false;toast('تعذّر الاتصال بالخوادم');render();return}
  const pre=TOPIC_ROOT+'list/';
  conns.forEach(c=>{c.mq.on((t,p)=>{
    if(!t.startsWith(pre))return;const key=t.slice(pre.length)+'_'+c.idx;
    if(!p)delete C.rooms[key];else{try{const r=JSON.parse(p);if(r&&r.code){r.b=c.idx;C.rooms[key]=r}}catch(e){}}
    if(!roomsRT)roomsRT=setTimeout(()=>{roomsRT=null;if(C.screen==='rooms')render()},250);
  });c.mq.subscribe(pre+'+')});
  setTimeout(()=>{C.roomsLoading=false;if(C.screen==='rooms')render()},2200);
  clearInterval(roomsTick);roomsTick=setInterval(()=>{if(C.screen==='rooms')render();else clearInterval(roomsTick)},5000);
}

  const over=n>g.max;

function reacts(){return'<div class="reacts">'+REACTS.map(e=>'<button data-a="react" data-v="'+e+'">'+e+'</button>').join('')+'</div>'}
function board(showDone){

    '<div class="a">'+esc(p.av)+'</div><div class="n">'+esc(p.name)+'</div><div class="s">'+fmt(C.sc[p.id]||0)+'</div></div>').join('')+'</div>';

function updateDoneMarks(){
  const b=$('#board');if(!b){render();return}
  const done=new Set((C.st&&C.st.done)||[]);
  b.querySelectorAll('.bp').forEach(el=>{const id=el.dataset.pid;const has=el.querySelector('.dn');
    if(done.has(id)&&!has)el.insertAdjacentHTML('afterbegin','<span class="dn">✓</span>');if(!done.has(id)&&has)has.remove();
    const s=el.querySelector('.s');if(s)s.textContent=fmt(C.sc[id]||0)});
  const wl=$('#waitlist');if(wl)wl.innerHTML=waitItems();
  C.deadline=performance.now()+((C.st&&C.st.ms)||0);
}
function gameHead(){const g=G(),st=C.st||{};return'<div class="gamehead"><div class="gtitle">'+g.icon+' '+g.name+'</div><div class="chips"><span class="chip btnchip" data-a="help" data-v="'+(st.g||'')+'">❓ الشرح</span>'+(st.ph==='draft'?'<span class="chip" style="color:var(--gc)">👥 اختيار الفرق</span>':st.tb?'<span class="chip" style="color:var(--gc)">⚔️ جولة فاصلة</span>':'<span class="chip">'+(st.g==='million'?'السؤال ':'الجولة ')+(st.r||1)+' / '+(st.N||1)+'</span>')+'</div></div>'}

    if(right!=null){cls+=i===right?' right':' dim'}else if(sel!=null){cls+=i===sel?' sel':' dim'}else if(gone)cls+=' dim';
    const who=whoMap&&whoMap[i]?'<span class="who">'+whoMap[i]+'</span>':'';
    return'<button class="'+cls+'" '+(disabled||gone||sel!=null||right!=null?'disabled':'data-a="ans" data-v="'+i+'"')+'>'+esc(num?fmt(x):x)+who+'</button>'}).join('')+'</div>';
}
function waitItems(){

    h+='<div style="margin-top:6px">'+R.items.map(it=>{const p=pl(it.id);let x='';const ok=okOf(it);

  const st0=C.st||{},last=R.g==='million'?!!R.over:st0.r>=st0.N;let tie=false;

}

    case 'mm':ctl('mm',{m:v});break;
    case 'wpick':if(C.mine.pick==null){C.mine.pick=v;act('pick',v);render()}break;
    case 'sendtxt':{const t=(($('#txt')||{}).value||'').trim();if(!t){toast('اكتب جوابك أول ✍️');break}if(C.mine.txt==null){C.mine.txt=t;act('txt',t);render()}break}
    case 'sendgs':if(C.mine.gs==null&&C.round&&C.round.answers){const arr=C.round.answers.map((_,i)=>C.gsel[i]||null);C.mine.gs=arr;act('gs',arr);render()}break;
    case 'lie':C.lieSel=Number(v);render();break;
    case 'sendtl':{const ss=[0,1,2].map(i=>(($('#t'+i)||{}).value||'').trim());if(ss.some(x=>!x)){toast('اكتب الثلاث جمل كلها');break}if(C.lieSel==null){toast('حدد أي جملة هي الكذبة 🤥');break}
      if(!C.mine.st){C.mine.st={s:ss,lie:C.lieSel};act('tl',{s:ss,lie:C.lieSel});render()}break}
    case 'ff':if(C.round&&!C.round.ffUsed&&C.mine.ans==null)act('ff');break;
    case 'dpick':act('dpick',v);break;
    case 'tname':{const t=(($('#tname')||{}).value||'').trim();if(!t){toast('اكتب اسم الفريق');break}act('tname',t);delete C.drafts.tname;toast('تم حفظ اسم الفريق ✅');break}
  }
});
/* تفعيل الصوت: داخل الغرفة بأي ضغطة، وبره الغرفة بس من أزرار الدخول (عشان ما يوقف الأغاني في جوالك وأنت بالصفحة الرئيسية) */
const VOICE_KEYS=['create','createp','joinroom','joinlink','kpgo','quick'];
const voiceTap=e=>{if(C.joined||V.ctx){voiceCtx();return}const el=e.target&&e.target.closest&&e.target.closest('[data-a]');if(el&&VOICE_KEYS.includes(el.dataset.a))voiceCtx()};
document.addEventListener('click',voiceTap,true);
['touchend','pointerup'].forEach(ev=>document.addEventListener(ev,voiceTap,{capture:true,passive:true})); // الآيفون يحتاج لمسة عشان يشغّل الصوت
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')voiceWake()});
function saveName(){const i=$('#nm');if(i)LS.set('fg_name',i.value.trim())}
function confirmLeave(){return C.state==='lobby'&&!Net.isHost?true:window.confirm(Net.isHost?'تبي تقفل الغرفة على الكل؟':'تبي تطلع من اللعبة؟')}
function copyLink(){
  const u=roomLink();
  const ok=()=>toast('تم نسخ الرابط ✅');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(ok).catch(()=>fallbackCopy(u,ok));else fallbackCopy(u,ok);
}
function fallbackCopy(u,ok){const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast(u)}t.remove()}

/* للتجربة الآلية فقط */
window.__fg={C,H,Net,GAMES,BANK};
render();
if(!LS.get('fg_intro',false))showIntro(); // شرح أول دخول بس
</script>
